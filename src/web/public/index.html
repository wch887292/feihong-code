<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>飞虹 Code 控制台 / fhcode Console</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --ink: #1f2933;
      --muted: #6b7785;
      --brand: #2563eb;
      --brand-soft: #eff4ff;
      --ok: #16a34a;
      --err: #dc2626;
      --border: #e3e8ef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(31, 41, 51, 0.08);
    }
    header h1 { margin: 0 0 4px; font-size: 22px; }
    header p { margin: 0; color: var(--muted); font-size: 13px; }
    .lang-switch {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 18px 0;
      font-size: 13px;
      color: var(--muted);
    }
    .lang-switch button {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--ink);
      border-radius: 8px;
      padding: 5px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    .lang-switch button.active {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }
    .status {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 16px;
      background: var(--brand-soft);
    }
    .status.error { background: #fef2f2; color: var(--err); }
    dl {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 10px 12px;
      margin: 0 0 16px;
      font-size: 14px;
    }
    dt { color: var(--muted); }
    dd { margin: 0; word-break: break-all; }
    .hint {
      font-size: 12px;
      color: var(--muted);
      background: #f8fafc;
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin: 0 0 16px;
      line-height: 1.6;
    }
    #refresh {
      border: none;
      background: var(--brand);
      color: #fff;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
    }
    #refresh:hover { filter: brightness(1.05); }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <h1 data-i18n="title">飞虹 Code 控制台</h1>
      <p data-i18n="subtitle">终端 AI 编程智能体（Muse Code 参照复刻）</p>
    </header>

    <div class="lang-switch">
      <span data-i18n="langLabel">语言</span>
      <button data-lang="zh">中文</button>
      <button data-lang="en">English</button>
    </div>

    <div class="status" id="status">…</div>

    <dl>
      <dt data-i18n="productLabel">产品</dt>
      <dd id="product">—</dd>
      <dt data-i18n="versionLabel">版本</dt>
      <dd id="version">—</dd>
      <dt data-i18n="signatureLabel">署名</dt>
      <dd id="signature">—</dd>
      <dt data-i18n="enterpriseLabel">企业模式</dt>
      <dd id="enterprise">—</dd>
    </dl>

    <p class="hint" data-i18n="tokenHint">
      访问令牌由终端输出（FH_WEB_TOKEN），本控制台仅观测、不执行任务。
    </p>

    <button id="refresh" data-i18n="refresh">刷新</button>
  </div>

  <script>
    const UI = {
      zh: {
        title: '飞虹 Code 控制台',
        subtitle: '终端 AI 编程智能体（Muse Code 参照复刻）',
        langLabel: '语言',
        productLabel: '产品',
        versionLabel: '版本',
        signatureLabel: '署名',
        enterpriseLabel: '企业模式',
        tokenHint: '访问令牌由终端输出（FH_WEB_TOKEN），本控制台仅观测、不执行任务。',
        refresh: '刷新',
        statusOk: '运行正常 ✅',
        statusErr: '无法连接控制台服务，请确认 fhcode serve 正在运行。',
        on: '开启',
        off: '关闭',
      },
      en: {
        title: 'fhcode Console',
        subtitle: 'Terminal AI coding agent (Muse Code reimplementation)',
        langLabel: 'Language',
        productLabel: 'Product',
        versionLabel: 'Version',
        signatureLabel: 'Signature',
        enterpriseLabel: 'Enterprise mode',
        tokenHint: 'Access token is printed in the terminal (FH_WEB_TOKEN). This console is observe-only and does not execute tasks.',
        refresh: 'Refresh',
        statusOk: 'Running ✅',
        statusErr: 'Cannot reach the console service. Make sure `fhcode serve` is running.',
        on: 'on',
        off: 'off',
      },
    };

    function detectLang() {
      const q = new URLSearchParams(location.search).get('lang');
      if (q === 'zh' || q === 'en') return q;
      const saved = localStorage.getItem('fhcode.lang');
      if (saved === 'zh' || saved === 'en') return saved;
      const nav = (navigator.language || '').toLowerCase();
      if (nav.startsWith('zh')) return 'zh';
      if (nav.startsWith('en')) return 'en';
      return 'zh';
    }

    let lang = detectLang();

    function applyLang() {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        const key = el.getAttribute('data-i18n');
        if (UI[lang][key]) el.textContent = UI[lang][key];
      });
      document.querySelectorAll('.lang-switch button').forEach((b) => {
        b.classList.toggle('active', b.getAttribute('data-lang') === lang);
      });
    }

    function setStatus(ok, msg) {
      const el = document.getElementById('status');
      el.classList.toggle('error', !ok);
      el.textContent = msg;
    }

    async function load() {
      try {
        const res = await fetch('/api/health');
        const d = await res.json();
        if (d.lang && !new URLSearchParams(location.search).get('lang') && !localStorage.getItem('fhcode.lang')) {
          lang = d.lang;
          applyLang();
        }
        document.getElementById('product').textContent = d.product || '—';
        document.getElementById('version').textContent = d.version || '—';
        document.getElementById('signature').textContent = d.signature || '—';
        document.getElementById('enterprise').textContent =
          d.enterprise === true ? UI[lang].on : d.enterprise === false ? UI[lang].off : '—';
        setStatus(true, UI[lang].statusOk);
      } catch (e) {
        setStatus(false, UI[lang].statusErr);
      }
    }

    document.querySelectorAll('.lang-switch button').forEach((b) => {
      b.addEventListener('click', () => {
        lang = b.getAttribute('data-lang');
        localStorage.setItem('fhcode.lang', lang);
        applyLang();
        load();
      });
    });
    document.getElementById('refresh').addEventListener('click', load);

    applyLang();
    load();
  </script>
</body>
</html>
