<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>同步任务</title>
  <link rel="stylesheet" href="css/sync.css">
</head>
<body>
  <!--
   * 飞虹 Code (对标 Muse Code · 自研内核)
   * 晋江市飞虹智科技企业管理有限公司 · 飞扬企源研发中心 · 负责人：吴赐虹
   * 同步任务页：跨端任务列表 / 上下文查看 / 远程下发 goal（二次确认）
  -->

  <!-- 顶部导航栏（返回首页，解决「无法返回」） -->
  <header class="sync-topbar">
    <button class="sync-back-btn" id="backBtn" title="返回首页">←</button>
    <div class="sync-topbar-title">同步任务</div>
    <span class="sync-topbar-right"></span>
  </header>

  <!-- 错误提示条 -->
  <div id="errorBar" class="sync-error-bar" style="display:none;"></div>

  <!-- 配置区（未配置时显示；正常情况地址与令牌已内置，打开即用） -->
  <section id="configSection" class="config-section" style="display:none;">
    <h2 class="section-title">服务器配置</h2>
    <div style="font-size:12px;color:var(--ink-2,#6b7280);margin-bottom:10px;">✅ 服务器地址与访问令牌已内置，打开即用；仅当内置值失效时才需手动修改。</div>
    <div class="form-group">
      <label for="syncUrlInput">服务器地址</label>
      <input type="text" id="syncUrlInput" placeholder="https://sync.klai.top" value="https://sync.klai.top">
    </div>
    <div class="form-group">
      <label for="syncTokenInput">访问令牌</label>
      <input type="password" id="syncTokenInput" placeholder="与 sync-server 的 FHCODE_SYNC_TOKEN 一致">
    </div>
    <button id="saveConfigBtn" class="btn-primary">保存配置</button>
    <div id="configMsg" class="config-msg"></div>
  </section>

  <!-- 任务列表区（已配置时显示） -->
  <section id="listSection" style="display:none;">
    <div class="list-head">
      <h2 class="section-title">任务列表</h2>
      <button id="refreshBtn" class="refresh-btn">刷新</button>
    </div>
    <div id="taskList" class="task-list"></div>
  </section>

  <!-- 底部新任务按钮 -->
  <button id="newTaskFab" class="fab" style="display:none;">＋ 新任务</button>

  <!-- 详情弹层 -->
  <div id="detailSheet" class="sheet-mask">
    <div class="sheet">
      <div class="sheet-head">
        <h2>任务详情</h2>
        <span class="sheet-close" data-close="detailSheet">&times;</span>
      </div>
      <div class="detail-info">
        <div class="info-row"><span class="info-label">状态</span><span id="detailStatus" class="status-badge queued">queued</span></div>
        <div class="info-row"><span class="info-label">目标</span><span id="detailGoal"></span></div>
        <div class="info-row"><span class="info-label">更新</span><span id="detailUpdated"></span></div>
      </div>
      <h3 class="sub-title">对话记录</h3>
      <div id="detailMessages" class="messages-list"></div>
      <h3 class="sub-title">子任务队列</h3>
      <div id="detailGoals" class="goals-list"></div>
    </div>
  </div>

  <!-- 新任务弹层 -->
  <div id="newTaskSheet" class="sheet-mask">
    <div class="sheet">
      <div class="sheet-head">
        <h2>新建同步任务</h2>
        <span class="sheet-close" data-close="newTaskSheet">&times;</span>
      </div>
      <div class="form-group">
        <label for="newGoalInput">任务目标</label>
        <textarea id="newGoalInput" rows="4" placeholder="请输入要下发的任务..."></textarea>
      </div>
      <div class="form-group">
        <label>执行端</label>
        <div class="executor-picker" id="executorPicker">
          <button type="button" class="executor-option active" data-executor="local">本机执行</button>
          <button type="button" class="executor-option" data-executor="cloud">云端执行</button>
        </div>
        <p class="executor-hint" id="executorHint">本机执行：任务由 H 盘 fhcode 认领，本机开机才会跑</p>
      </div>
      <button id="confirmNewTaskBtn" class="btn-primary">下一步</button>
    </div>
  </div>

  <!-- 二次确认弹层（高危下发动作，展示 goal 全文后才允许发送） -->
  <div id="confirmSheet" class="sheet-mask">
    <div class="sheet">
      <div class="sheet-head">
        <h2>确认下发</h2>
        <span class="sheet-close" data-close="confirmSheet">&times;</span>
      </div>
      <p class="confirm-tip" id="confirmExecutorTip">即将把以下任务下发给本机 fhcode 执行，请确认内容：</p>
      <div id="confirmGoalText" class="confirm-goal"></div>
      <button id="sendTaskBtn" class="btn-primary">确认下发</button>
      <button id="cancelConfirmBtn" class="btn-secondary">取消</button>
    </div>
  </div>

  <script src="js/sync-task.js"></script>
</body>
</html>
