<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<title>飞虹 Code · 移动版</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== 顶栏 ===== -->
<div class="headbar">
  <div class="brand"><span class="logo">飞</span>飞虹 Code</div>
  <div class="head-actions">
    <button class="icon-btn" id="newChatBtn" title="新对话">＋</button>
    <button class="icon-btn" id="menuBtn" title="设置">☰</button>
  </div>
</div>

<!-- ===== 对话页 ===== -->
<div class="page active" id="convPage">
  <!-- 两排横向滑动功能按钮 -->
  <div class="func-scroll">
    <div class="func-row">
      <button class="func-btn active" data-func="chat">💬<span>对话</span></button>
      <button class="func-btn" data-func="fix-code">🔧<span>修复代码</span></button>
      <button class="func-btn" data-func="write-code">✍️<span>编写代码</span></button>
      <button class="func-btn" data-func="review">🔍<span>代码审查</span></button>
      <button class="func-btn" data-func="explain">💡<span>代码解释</span></button>
    </div>
    <div class="func-row">
      <button class="func-btn" data-func="comments">📝<span>添加注释</span></button>
      <button class="func-btn" data-func="optimize">⚡<span>代码优化</span></button>
      <button class="func-btn" data-func="translate">🌐<span>中英互译</span></button>
      <button class="func-btn" data-func="regex">🔤<span>正则生成</span></button>
      <button class="func-btn" data-func="more">⋯<span>更多</span></button>
    </div>
  </div>

  <div class="conv-head">
    <div class="goal" id="convGoal">新对话</div>
    <span class="badge" id="convStatus" style="display:none;"></span>
  </div>
  <div class="messages" id="convMessages">
    <div class="empty">选择上方功能，或直接输入指令开始对话<br>支持代码生成、修复、审查等</div>
  </div>
  <div class="input-area">
    <textarea class="input goal-input" id="goalInput" placeholder="输入指令，Enter 发送，Shift+Enter 换行" rows="1"></textarea>
    <button class="btn send-btn" id="sendBtn">▶</button>
  </div>
</div>

<!-- ===== 任务页（独立窗口） ===== -->
<div class="page" id="taskPage">
  <div class="page-head">
    <div><h2>📋 任务管理</h2><div class="sub">所有任务独立管理，点击打开对话</div></div>
    <button class="btn sm ghost" id="clearTasksBtn" style="width:auto;padding:6px 12px;">清空</button>
  </div>
  <div id="taskList"><div class="empty">暂无任务，去对话页发起一个吧</div></div>
</div>

<!-- ===== 底部 Tab（仅对话 + 任务） ===== -->
<div class="tabbar">
  <div class="tab active" data-page="convPage"><span class="ti">💬</span>对话</div>
  <div class="tab" data-page="taskPage"><span class="ti">📋</span>任务</div>
</div>

<!-- ===== 侧边设置抽屉（从右侧滑出，设置完收起） ===== -->
<div class="drawer-mask" id="drawerMask"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-title">⚙️ 设置</div>
    <button class="icon-btn" id="drawerClose">✕</button>
  </div>
  <div class="drawer-body">
    <!-- 大模型设置 -->
    <div class="drawer-section">
      <div class="drawer-section-title">🧠 大模型</div>
      <div id="modelList"></div>
      <div style="margin-top:12px;">
        <label class="label">模型名称 *</label>
        <input class="input" id="mName" placeholder="如 DeepSeek Chat">
        <label class="label">API 地址</label>
        <input class="input" id="mBase" placeholder="https://api.deepseek.com/v1">
        <label class="label">API Key</label>
        <input class="input" id="mKey" type="password" placeholder="sk-...">
        <label class="label">推理内容（可选）</label>
        <textarea class="input" id="mReasoning" rows="2" placeholder="中间环节…"></textarea>
        <div class="form-msg" id="mMsg"></div>
        <div class="footer" style="margin-top:10px;">
          <button class="btn ghost" id="mResetBtn">清空</button>
          <button class="btn" id="mSaveBtn">保存</button>
        </div>
      </div>
    </div>

    <!-- 外观 -->
    <div class="drawer-section">
      <div class="drawer-section-title">🎨 外观</div>
      <button class="btn ghost" id="themeBtn" style="width:100%;">切换深色 / 浅色</button>
    </div>

    <!-- 关于 -->
    <div class="drawer-section">
      <div class="drawer-section-title">🎖 关于</div>
      <div style="font-size:13px;color:var(--ink-2);line-height:1.8;">
        飞虹 Code 移动版 v1.2.0<br>
        纯前端独立 APP · 数据本地存储<br>
        晋江市飞虹智科技企业管理有限公司
      </div>
    </div>
  </div>
</div>

<!-- ===== 代码修复 Sheet ===== -->
<div class="sheet-mask" id="fixCodeSheet">
  <div class="sheet">
    <div class="sheet-head"><div class="sheet-title">🔧 修复代码</div><span class="sheet-close" onclick="hideSheet('fixCodeSheet')">✕</span></div>
    <div class="sheet-body">
      <label class="label">编程语言</label>
      <select class="input" id="fcLang">
        <option value="auto">自动识别</option>
        <option value="JavaScript">JavaScript</option>
        <option value="TypeScript">TypeScript</option>
        <option value="Python">Python</option>
        <option value="Java">Java</option>
        <option value="Go">Go</option>
        <option value="Rust">Rust</option>
        <option value="C++">C++</option>
        <option value="其他">其他</option>
      </select>
      <label class="label">需要修复的代码 *</label>
      <textarea class="input" id="fcCode" rows="6" placeholder="粘贴有问题的代码…"></textarea>
      <label class="label">错误信息或问题描述（可选）</label>
      <textarea class="input" id="fcError" rows="3" placeholder="粘贴报错信息…"></textarea>
      <div class="footer">
        <button class="btn ghost" onclick="hideSheet('fixCodeSheet')">取消</button>
        <button class="btn" id="fcRunBtn">开始修复</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== 代码编写 Sheet ===== -->
<div class="sheet-mask" id="writeCodeSheet">
  <div class="sheet">
    <div class="sheet-head"><div class="sheet-title">✍️ 编写代码</div><span class="sheet-close" onclick="hideSheet('writeCodeSheet')">✕</span></div>
    <div class="sheet-body">
      <label class="label">编程语言 *</label>
      <select class="input" id="wcLang">
        <option value="JavaScript">JavaScript</option>
        <option value="TypeScript">TypeScript</option>
        <option value="Python">Python</option>
        <option value="Java">Java</option>
        <option value="Go">Go</option>
        <option value="Rust">Rust</option>
        <option value="C++">C++</option>
        <option value="HTML/CSS">HTML/CSS</option>
        <option value="SQL">SQL</option>
        <option value="Shell">Shell</option>
      </select>
      <label class="label">代码需求 *</label>
      <textarea class="input" id="wcReq" rows="6" placeholder="描述你想要的功能…"></textarea>
      <div class="footer">
        <button class="btn ghost" onclick="hideSheet('writeCodeSheet')">取消</button>
        <button class="btn" id="wcRunBtn">开始生成</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== 插件输入 Sheet ===== -->
<div class="sheet-mask" id="pluginSheet">
  <div class="sheet">
    <div class="sheet-head"><div class="sheet-title" id="pluginTitle">插件</div><span class="sheet-close" onclick="hideSheet('pluginSheet')">✕</span></div>
    <div class="sheet-body">
      <label class="label">输入内容 *</label>
      <textarea class="input" id="pluginInput" rows="6" placeholder="输入代码或文本…"></textarea>
      <div class="footer">
        <button class="btn ghost" onclick="hideSheet('pluginSheet')">取消</button>
        <button class="btn" id="pluginRunBtn">运行</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
