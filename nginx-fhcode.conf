# fhcode Web 控制台 - www.jb.klai.top 反代配置
# 晋江市飞虹智科技企业管理有限公司 · 飞扬企源研发中心 · 负责人：吴赐虹
# 安全分层：
#   /                 页面入口    → Basic Auth（防陌生人看到登录页）
#   /api/auth/login   登录接口    → Basic Auth（防绕过：无凭据无法换取会话 token）
#   /api/*            其余接口    → 无 Basic（前端带 Bearer token，由 fhcode fail-closed 校验）
# 说明：浏览器登录后 fetch 显式携带 Bearer，会覆盖自动 Basic 头，故其余 API 不能依赖 Basic。

# HTTP → HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    server_name www.jb.klai.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.jb.klai.top;

    # SSL（复用宝塔已签发证书）· 三重加密第一重：仅 TLS 1.2/1.3 + 强密码套件
    ssl_certificate    /www/server/panel/vhost/cert/www.jb.klai.top/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/www.jb.klai.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # 禁止访问敏感文件
    location ~* \.(user.ini|htaccess|env|git|log|bak|tmp|sql)$ { deny all; }

    # 登录接口：Basic Auth 保护（防绕过换 token）
    location = /api/auth/login {
        auth_basic "fhcode Web Console";
        auth_basic_user_file /www/dk_project/fhcode/.htpasswd;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # 其余 API：Bearer token 校验（fhcode fail-closed），长轮询/上传支持
    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        client_max_body_size 20m;
    }

    # 移动版入口（APK WebView / 手机浏览器）：页面无敏感数据，不设 Basic Auth
    # 说明：移动版登录请求自带 Basic 凭据（App 内置），其余 API 走 Bearer，鉴权闭环不变
    location /m/ {
        alias /www/dk_project/fhcode-mobile/;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    # 页面与静态资源：Basic Auth 保护
    location / {
        auth_basic "fhcode Web Console";
        auth_basic_user_file /www/dk_project/fhcode/.htpasswd;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        client_max_body_size 20m;
    }
}
