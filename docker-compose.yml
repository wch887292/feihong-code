# 飞虹 Code (fhcode) — 稳定部署编排
# 用法：
#   docker compose up -d          # 启动 Web 控制台（默认 8080）
#   FH_WEB_TOKEN=xxx docker compose up -d
# 数据持久化在命名卷 fhcode-data（对应容器 FH_HOME=/data/fhcode）。

services:
  fhcode:
    build: .
    image: feihong-code:0.1.0
    container_name: fhcode
    ports:
      - "8080:8080"
    environment:
      - FH_HOME=/data/fhcode
      - FH_WEB_PORT=8080
      # 生产环境务必通过环境变量注入强随机令牌；此处仅为占位默认值
      - FH_WEB_TOKEN=${FH_WEB_TOKEN:-change-me-in-production}
      - FH_ENTERPRISE=true
    volumes:
      - fhcode-data:/data/fhcode
    restart: unless-stopped

volumes:
  fhcode-data:
